<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Só Uma</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #333333;

      --blue: #2563eb;
      --purple: #7c3aed;
      --green: #16a34a;
      --orange: #ea580c;
      --pink: #db2777;
      --red: #dc2626;
      --cyan: #0891b2;
      --yellow: #ca8a04;
      --indigo: #4f46e5;
      --violet: #9333ea;
      --teal: #0f766e;
      --amber: #d97706;
      --magenta: #c026d3;
      --sky: #0284c7;
      --lime: #65a30d;
      --rose: #e11d48;

      --panel: #f5f5f5;
      --border: #dddddd;
      --radius: 14px;
      --shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 28px 20px 20px;
    }


    /* =========================
       CABEÇALHO
    ========================= */

    .header {
      position: relative;
      min-height: 38px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      color: var(--purple);
    }

    .score {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);

      display: flex;
      align-items: center;
      gap: 10px;

      user-select: none;
    }

    .score-button {
      border: none;
      background: transparent;
      box-shadow: none;

      padding: 4px;
      margin: 0;

      font-family: inherit;
      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: opacity 0.2s;
      touch-action: manipulation;
    }

    .score-button:hover {
      transform: none;
      opacity: 0.7;
    }

    .score-button:active {
      transform: none;
    }

    .correct-score {
      color: var(--green);
    }

    .wrong-score {
      color: var(--red);
    }

    .reset-score {
      color: var(--text);
    }


    /* =========================
       TELAS
    ========================= */

    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .screen.active {
      display: flex;
    }

    .home-content {
      justify-content: center;
    }

    h2 {
      font-size: 24px;
      margin-bottom: 24px;
    }


    /* =========================
       BOTÕES DE PAPEL
    ========================= */

    .role-buttons {
      width: 100%;
      max-width: 400px;

      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: var(--radius);

      padding: 14px 20px;

      font-family: inherit;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s,
        opacity 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .guess-button {
      background: var(--blue);
      color: white;
    }

    .clue-button {
      background: var(--green);
      color: white;
    }

    .generate-button {
      background: var(--purple);
      color: white;
      margin-top: 20px;
    }

    .ok-button {
      background: var(--orange);
      color: white;
      margin-top: 16px;
    }


    /* =========================
       CAMPO DE PISTA
    ========================= */

    .input-box {
      width: 100%;
      max-width: 500px;

      padding: 15px;

      border: 2px solid var(--purple);
      border-radius: 12px;

      font-family: inherit;
      font-size: 18px;
      font-weight: 500;

      text-align: center;
      text-transform: uppercase;

      outline: none;
    }

    .input-box:focus {
      border-color: var(--pink);
    }


    /* =========================
       CONTAGEM REGRESSIVA
    ========================= */

    .countdown {
      display: none;

      justify-content: center;
      align-items: center;

      flex: 1;
      width: 100%;

      font-size: clamp(80px, 35vw, 200px);
      font-weight: bold;

      color: var(--purple);
    }

    .countdown.active {
      display: flex;
    }


    /* =========================
       RESULTADOS
    ========================= */

    .result-word {
      display: none;

      flex: 1;
      width: 100%;

      justify-content: center;
      align-items: center;

      padding: 10px;

      overflow-wrap: anywhere;
    }

    .result-word.active {
      display: flex;
    }

    .result-word span {
      max-width: 100%;

      font-size: clamp(40px, 16vw, 140px);
      font-weight: 800;
      line-height: 1.05;

      word-break: break-word;
      text-align: center;
    }


    /* =========================
       CONTROLES INFERIORES
    ========================= */

    .bottom-controls {
      display: none;

      margin-top: auto;
      padding-top: 20px;

      width: 100%;

      gap: 10px;
    }

    .bottom-controls button {
      flex: 1;
      min-width: 0;

      background: var(--panel);
      color: var(--text);

      border: 1px solid var(--border);
      box-shadow: none;

      font-size: 15px;
      padding: 10px 12px;
    }


    /* =========================
       RESPONSIVIDADE
    ========================= */

    @media (max-width: 500px) {

      .app {
        padding: 22px 14px 16px;
      }

      .header {
        margin-bottom: 24px;
      }

      h1 {
        font-size: 28px;
      }

      .score {
        gap: 6px;
      }

      .score-button {
        font-size: 14px;
      }

      h2 {
        font-size: 22px;
      }

      .role-buttons button {
        min-height: 60px;
      }

      .bottom-controls {
        gap: 8px;
      }

      .bottom-controls button {
        font-size: 14px;
        padding: 10px 8px;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =========================
         CABEÇALHO
    ========================= -->

    <div class="header" id="header">

      <h1 id="title">1️⃣ Só Uma 1️⃣</h1>

      <div class="score">

        <button
          class="score-button correct-score"
          id="correctScore"
          title="Toque: +1 | Segure: -1"
        >
          ✓ 0
        </button>

        <button
          class="score-button wrong-score"
          id="wrongScore"
          title="Toque: +1 | Segure: -1"
        >
          × 0
        </button>

        <button
          class="score-button reset-score"
          id="resetScore"
          title="Zerar placar"
        >
          ↺
        </button>

      </div>

    </div>


    <!-- =========================
         TELA INICIAL
    ========================= -->

    <div
      class="screen active home-content"
      id="homeScreen"
    >

      <h2>Qual seu papel?</h2>

      <div class="role-buttons">

        <button
          class="guess-button"
          onclick="mostrarAdivinhar()"
        >
          🕵️ Descobrir a palavra secreta
        </button>

        <button
          class="clue-button"
          onclick="mostrarPista()"
        >
          ✍️ Escrever uma pista
        </button>

      </div>

    </div>


    <!-- =========================
         TELA: DESCOBRIR PALAVRA
    ========================= -->

    <div
      class="screen"
      id="guessScreen"
    >

      <div id="guessControls">

        <h2>🕵️ Pronto para descobrir?</h2>

        <button
          class="generate-button"
          onclick="sortearPalavra()"
        >
          🎲 Sortear palavra secreta!
        </button>

      </div>


      <div
        class="countdown"
        id="countdown"
      ></div>


      <div
        class="result-word"
        id="secretResult"
      >
        <span id="secretWord"></span>
      </div>

    </div>


    <!-- =========================
         TELA: ESCREVER PISTA
    ========================= -->

    <div
      class="screen"
      id="clueScreen"
    >

      <div id="clueControls">

        <h2>✍️ Escreva sua pista</h2>

        <input
          type="text"
          id="clueInput"
          class="input-box"
          placeholder="DIGITE SUA PISTA..."
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        />

        <br>

        <button
          class="ok-button"
          onclick="mostrarPistaEscrita()"
        >
          OK
        </button>

      </div>


      <div
        class="result-word"
        id="clueResult"
      >
        <span id="clueWord"></span>
      </div>

    </div>


    <!-- =========================
         CONTROLES INFERIORES
    ========================= -->

    <div
      class="bottom-controls"
      id="bottomControls"
    >

      <button
        id="newActionButton"
        onclick="novaAcao()"
      >
        🎲 Nova palavra
      </button>

      <button
        onclick="trocarPapel()"
      >
        🔄 Trocar de papel
      </button>

    </div>

  </div>


  <script>

    /* =========================
       PALETA DE CORES
    ========================= */

    const CORES = [

      "#2563eb",
      "#7c3aed",
      "#16a34a",
      "#ea580c",

      "#db2777",
      "#dc2626",
      "#0891b2",
      "#ca8a04",

      "#4f46e5",
      "#9333ea",
      "#0f766e",
      "#d97706",

      "#c026d3",
      "#0284c7",
      "#65a30d",
      "#e11d48"

    ];


    function corAleatoria() {

      return CORES[
        Math.floor(Math.random() * CORES.length)
      ];

    }


    /* =========================
       PLACAR
    ========================= */

    let acertos =
      Number(localStorage.getItem("souma_acertos")) || 0;

    let erros =
      Number(localStorage.getItem("souma_erros")) || 0;


    function atualizarPlacar() {

      document.getElementById("correctScore").textContent =
        `✓ ${acertos}`;

      document.getElementById("wrongScore").textContent =
        `× ${erros}`;

      localStorage.setItem(
        "souma_acertos",
        acertos
      );

      localStorage.setItem(
        "souma_erros",
        erros
      );

    }


    function alterarPlacar(tipo, quantidade) {

      if (tipo === "acertos") {

        acertos =
          Math.max(0, acertos + quantidade);

      }

      if (tipo === "erros") {

        erros =
          Math.max(0, erros + quantidade);

      }

      atualizarPlacar();

    }


    function resetarPlacar() {

      if (
        !confirm(
          "Deseja zerar o placar?"
        )
      ) {

        return;

      }


      acertos = 0;

      erros = 0;


      atualizarPlacar();

    }


    /*
      Controle do toque:

      toque curto  → +1
      toque longo  → -1

      O movimento precisa terminar sobre
      o próprio botão para ser considerado
      um toque curto.
    */

    function configurarPlacar(elemento, tipo) {

      let inicioToque = 0;
      let timer = null;
      let toqueLongo = false;


      elemento.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          inicioToque =
            Date.now();

          toqueLongo = false;


          timer = setTimeout(
            function() {

              toqueLongo = true;

              alterarPlacar(
                tipo,
                -1
              );

            },
            600
          );

        }
      );


      elemento.addEventListener(
        "pointerup",
        function(event) {

          event.preventDefault();

          clearTimeout(timer);


          const duracao =
            Date.now() - inicioToque;


          if (!toqueLongo && duracao < 600) {

            alterarPlacar(
              tipo,
              1
            );

          }

        }
      );


      elemento.addEventListener(
        "pointerleave",
        function() {

          clearTimeout(timer);

        }
      );


      elemento.addEventListener(
        "pointercancel",
        function() {

          clearTimeout(timer);

        }
      );

    }


    configurarPlacar(
      document.getElementById("correctScore"),
      "acertos"
    );

    configurarPlacar(
      document.getElementById("wrongScore"),
      "erros"
    );

    atualizarPlacar();


    document
      .getElementById("resetScore")
      .addEventListener(
        "click",
        resetarPlacar
      );


    /* =========================
       NAVEGAÇÃO
    ========================= */

    function esconderTodasTelas() {

      document
        .querySelectorAll(".screen")
        .forEach(screen => {

          screen.classList.remove("active");

        });

    }


    function atualizarCabecalho() {

      const homeAtiva =
        document
          .getElementById("homeScreen")
          .classList
          .contains("active");


      const title =
        document.getElementById("title");


      title.style.display =
        homeAtiva
          ? "block"
          : "none";


      document
        .getElementById("header")
        .style.marginBottom =
          homeAtiva
            ? "30px"
            : "10px";

    }


    function atualizarBotaoInferior() {

      const guessAtivo =
        document
          .getElementById("guessScreen")
          .classList
          .contains("active");


      const clueAtivo =
        document
          .getElementById("clueScreen")
          .classList
          .contains("active");


      const bottomControls =
        document.getElementById("bottomControls");


      const button =
        document.getElementById("newActionButton");


      /*
        Na tela inicial, todos os controles
        inferiores ficam ocultos.
      */

      if (!guessAtivo && !clueAtivo) {

        bottomControls.style.display =
          "none";

        return;

      }


      bottomControls.style.display =
        "flex";


      if (guessAtivo) {

        button.textContent =
          "🎲 Nova palavra";

      }


      if (clueAtivo) {

        button.textContent =
          "✍️ Nova pista";

      }

    }


    function atualizarInterface() {

      atualizarCabecalho();

      atualizarBotaoInferior();

    }


    /* =========================
       ESCOLHER PAPEL
    ========================= */

    function mostrarAdivinhar() {

      esconderTodasTelas();


      document
        .getElementById("guessScreen")
        .classList
        .add("active");


      document
        .getElementById("guessControls")
        .style.display =
          "block";


      document
        .getElementById("countdown")
        .classList
        .remove("active");


      document
        .getElementById("secretResult")
        .classList
        .remove("active");


      atualizarInterface();

    }


    function mostrarPista() {

      esconderTodasTelas();


      document
        .getElementById("clueScreen")
        .classList
        .add("active");


      document
        .getElementById("clueControls")
        .style.display =
          "block";


      document
        .getElementById("clueResult")
        .classList
        .remove("active");


      const input =
        document.getElementById("clueInput");


      input.value = "";

      input.focus();


      atualizarInterface();

    }


    /* =========================
       TROCAR DE PAPEL
    ========================= */

    function trocarPapel() {

      const guessAtivo =
        document
          .getElementById("guessScreen")
          .classList
          .contains("active");


      if (guessAtivo) {

        mostrarPista();

      } else {

        mostrarAdivinhar();

      }

    }


    /* =========================
       LISTA DE PALAVRAS
    ========================= */

    let palavras = [];

    let carregamentoPalavras = null;


    async function carregarPalavras() {

      if (carregamentoPalavras) {

        return carregamentoPalavras;

      }


      carregamentoPalavras =
        (async function() {

          try {

            const resposta =
              await fetch(
                "data/souma/palavras.txt"
              );


            if (!resposta.ok) {

              throw new Error(
                `Erro ao carregar palavras: ${resposta.status}`
              );

            }


            const texto =
              await resposta.text();


            palavras =
              texto
                .split(/\r?\n/)
                .map(
                  palavra =>
                    palavra.trim()
                )
                .filter(
                  palavra =>
                    palavra.length > 0
                );


            if (palavras.length === 0) {

              throw new Error(
                "O arquivo de palavras está vazio."
              );

            }

          } catch (erro) {

            console.error(
              "Erro ao carregar as palavras:",
              erro
            );

            palavras = [];

            throw erro;

          }

        })();


      return carregamentoPalavras;

    }


    /* =========================
       SORTEAR PALAVRA
    ========================= */

    async function sortearPalavra() {

      const guessControls =
        document.getElementById("guessControls");


      const countdown =
        document.getElementById("countdown");


      const secretResult =
        document.getElementById("secretResult");


      guessControls.style.display =
        "none";


      secretResult.classList.remove(
        "active"
      );


      countdown.classList.add(
        "active"
      );


      for (
        let numero = 3;
        numero >= 1;
        numero--
      ) {

        countdown.textContent =
          numero;


        await new Promise(
          resolve =>
            setTimeout(
              resolve,
              700
            )
        );

      }


      countdown.classList.remove(
        "active"
      );


      if (palavras.length === 0) {

        alert(
          "As palavras ainda não foram carregadas. Tente novamente."
        );

        guessControls.style.display =
          "block";

        return;

      }


      const palavra =
        palavras[
          Math.floor(
            Math.random() *
            palavras.length
          )
        ];


      const secretWord =
        document.getElementById(
          "secretWord"
        );


      secretWord.textContent =
        palavra;


      secretWord.style.color =
        corAleatoria();


      secretResult.classList.add(
        "active"
      );

    }


    /* =========================
       NOVA PALAVRA
    ========================= */

    function novaPalavra() {

      const guessControls =
        document.getElementById(
          "guessControls"
        );


      const secretResult =
        document.getElementById(
          "secretResult"
        );


      secretResult.classList.remove(
        "active"
      );


      guessControls.style.display =
        "none";


      sortearPalavra();

    }


    /* =========================
       NOVA PISTA
    ========================= */

    function novaPista() {

      const clueControls =
        document.getElementById(
          "clueControls"
        );


      const clueResult =
        document.getElementById(
          "clueResult"
        );


      const input =
        document.getElementById(
          "clueInput"
        );


      clueResult.classList.remove(
        "active"
      );


      clueControls.style.display =
        "block";


      input.value = "";

      input.focus();

    }


    function novaAcao() {

      const guessAtivo =
        document
          .getElementById("guessScreen")
          .classList
          .contains("active");


      if (guessAtivo) {

        novaPalavra();

      } else {

        novaPista();

      }

    }


    /* =========================
       MOSTRAR PISTA
    ========================= */

    function mostrarPistaEscrita() {

      const input =
        document.getElementById(
          "clueInput"
        );


      const pista =
        input.value
          .trim()
          .toUpperCase();


      if (pista === "") {

        input.focus();

        return;

      }


      document
        .getElementById("clueControls")
        .style.display =
          "none";


      const clueWord =
        document.getElementById(
          "clueWord"
        );


      clueWord.textContent =
        pista;


      clueWord.style.color =
        corAleatoria();


      document
        .getElementById("clueResult")
        .classList
        .add("active");

    }


    /* =========================
       MAIÚSCULAS NA DIGITAÇÃO
    ========================= */

    document
      .getElementById("clueInput")
      .addEventListener(
        "input",
        function() {

          const posicao =
            this.selectionStart;


          this.value =
            this.value.toUpperCase();


          this.setSelectionRange(
            posicao,
            posicao
          );

        }
      );


    /* =========================
       ENTER NA PISTA
    ========================= */

    document
      .getElementById("clueInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            mostrarPistaEscrita();

          }

        }
      );


    /* =========================
       ESTADO INICIAL
    ========================= */

    carregarPalavras();

    atualizarInterface();

  </script>

</body>
</html>
