<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barcelona</title>

  <style>
    :root {
      --bg: #071b33;
      --bg-gradient: #04111f;
      --panel: #0d2945;
      --panel-light: #123556;
      --red: #c6283d;
      --red-light: #e04b5f;
      --text: #f4f6f8;
      --muted: #b8c4d1;
      --radius: 12px;
      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-gradient) 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0 0 22px;
      font-size: 30px;
      color: var(--text);
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: var(--text);
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--red);
      cursor: pointer;
    }

    button.generate {
      padding: 11px 22px;
      font-size: 17px;
      font-weight: bold;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: background-color 0.2s, transform 0.2s;
    }

    button.generate:hover {
      background: var(--red-light);
      transform: translateY(-2px);
    }

    .output {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section {
      background: var(--panel);
      border: 1px solid rgba(198, 40, 61, 0.7);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      text-align: left;
    }

    .section h2 {
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--red);
      color: var(--text);
      font-size: 19px;
    }

    .item-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .item {
      background: var(--panel-light);
      border: 1px solid rgba(198, 40, 61, 0.5);
      border-radius: 8px;
      padding: 11px 13px;
      color: var(--text);
      font-size: 15px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 14px;
      }

      h1 {
        font-size: 26px;
      }

      .section {
        padding: 14px;
      }

      .section h2 {
        font-size: 17px;
      }

      .item-list {
        grid-template-columns: 1fr;
      }

      .item {
        padding: 12px;
      }

      button.generate {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <h1>💃🏻 Barcelona 💃🏻</h1>

  <div class="controls">
    <label class="checkbox-label">
      <input type="checkbox" id="pdg">
      Passeig de Gràcia
    </label>

    <button class="generate" onclick="gerarPartida()">
      Monte uma Partida!
    </button>
  </div>

  <div class="output" id="output" hidden></div>

  <script>
    // =========================================
    // AÇÕES
    // =========================================

    const ACOES_SEM_PDG = [
      "Tecido",
      "Moedas",
      "Paralelepípedo",
      "Rua Larga",
      "Ruas Estreitas",
      "Intersecção",
      "Aprimorar Modernisme",
      "Iniciar Modernisme",
      "Serviço Público",
      "Bonde",
      "Cerdà"
    ];

    const ACOES_COM_PDG = [
      "Barcelona",
      "Gràcia",
      "Paralelepípedo",
      "Rua Larga",
      "Ruas Estreitas",
      "Intersecção",
      "Aprimorar Modernisme",
      "Iniciar Modernisme",
      "Serviço Público",
      "Bonde",
      "Recursos"
    ];


    // =========================================
    // PONTUAÇÃO DE CERDÀ
    // =========================================

    const CERDA_BASE = [
      "Quarteirões Ininterruptos",
      "Moeda",
      "Serviço Público",
      "Modernisme Aprimorado",
      "Paralelepípedo",
      "Tecido",
      "Rua Estreita",
      "Rua Larga",
      "Passageiro",
      "Intersecção",
      "Esquina",
      "Peça de Modernisme",
      "Marcador de Construção"
    ];

    const CERDA_PDG = [
      "Barcelona",
      "Gràcia"
    ];


    // =========================================
    // SERVIÇOS PÚBLICOS
    // =========================================

    const SERVICOS_BASE = [
      "Intersecção",
      "Tecido",
      "Sagrada",
      "Bonde",
      "Ruas",
      "Modernisme",
      "Paralelepípedo"
    ];

    const SERVICOS_PDG = [
      "Barcelona",
      "Gràcia",
      "Barcelona & Gràcia"
    ];


    // =========================================
    // AMENIDADES
    // =========================================

    const AMENIDADES = [
      "Serviço Público",
      "Peças de Modernisme",
      "Modernisme Aprimorado",
      "Passageiro",
      "Intersecção",
      "Paralelepípedo",
      "Rua Larga",
      "Rua Estreita"
    ];


    // =========================================
    // PARALELEPÍPEDOS
    // =========================================

    const PARALELEPIPEDOS_A = [
      "Marcador de Construção",
      "Modernisme"
    ];

    const PARALELEPIPEDOS_B = [
      "Passageiro",
      "Esquina"
    ];

    const PARALELEPIPEDOS_C = [
      "Cerdà",
      "Sagrada"
    ];


    // =========================================
    // SHUFFLE
    // =========================================

    function shuffle(array) {
      const arr = array.slice();

      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [arr[i], arr[j]] = [arr[j], arr[i]];
      }

      return arr;
    }


    // =========================================
    // CRIAR SEÇÃO
    // =========================================

    function criarSecao(titulo, emoji, itens) {
      const section = document.createElement("section");
      section.className = "section";

      const heading = document.createElement("h2");
      heading.textContent = `${emoji} ${titulo}`;

      const list = document.createElement("div");
      list.className = "item-list";

      itens.forEach(item => {
        const div = document.createElement("div");
        div.className = "item";
        div.textContent = item;
        list.appendChild(div);
      });

      section.appendChild(heading);
      section.appendChild(list);

      return section;
    }


    // =========================================
    // GERAR PARTIDA
    // =========================================

    function gerarPartida() {
      const pdg = document.getElementById("pdg").checked;
      const output = document.getElementById("output");

      output.hidden = false;
      output.innerHTML = "";


      // -----------------------------------------
      // AÇÕES
      // -----------------------------------------

      const acoes = pdg
        ? shuffle(ACOES_COM_PDG)
        : shuffle(ACOES_SEM_PDG);

      output.appendChild(
        criarSecao(
          "Ações",
          "🎯",
          acoes
        )
      );


      // -----------------------------------------
      // PONTUAÇÃO DE CERDÀ
      // -----------------------------------------

      const poolCerda = pdg
        ? [...CERDA_BASE, ...CERDA_PDG]
        : [...CERDA_BASE];

      const cerdaSelecionado = shuffle(poolCerda).slice(0, 3);

      output.appendChild(
        criarSecao(
          "Pontuação de Cerdà",
          "📐",
          cerdaSelecionado
        )
      );


      // -----------------------------------------
      // SERVIÇOS PÚBLICOS
      // -----------------------------------------

      let servicosSelecionados;

      if (pdg) {
        // Escolhe exatamente 1 opção especial de PdG
        const especial = shuffle(SERVICOS_PDG).slice(0, 1);

        // Escolhe as outras 4 entre os serviços normais
        const normais = shuffle(SERVICOS_BASE).slice(0, 4);

        servicosSelecionados = [
          ...especial,
          ...normais
        ];

        // Embaralha a ordem final
        servicosSelecionados = shuffle(servicosSelecionados);

      } else {
        servicosSelecionados = shuffle(SERVICOS_BASE).slice(0, 5);
      }

      output.appendChild(
        criarSecao(
          "Serviços Públicos",
          "🏛️",
          servicosSelecionados
        )
      );


      // -----------------------------------------
      // AMENIDADES
      // Apenas com Passeig de Gràcia
      // -----------------------------------------

      if (pdg) {
        const amenidadesSelecionadas = shuffle(AMENIDADES).slice(0, 6);

        output.appendChild(
          criarSecao(
            "Amenidades",
            "🌳",
            amenidadesSelecionadas
          )
        );


        // -----------------------------------------
        // PARALELEPÍPEDOS
        // -----------------------------------------

        const paralelepipedosSelecionados =
          shuffle(shuffle(PARALELEPIPEDOS_A).slice(0, 1).concat(shuffle(PARALELEPIPEDOS_B).slice(0, 1).concat(shuffle(PARALELEPIPEDOS_C).slice(0, 1))));

        output.appendChild(
          criarSecao(
            "Paralelepípedos",
            "🧱",
            paralelepipedosSelecionados
          )
        );
      }


      setTimeout(() => {
        output.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }, 80);
    }
  </script>

</body>
</html>
